[project]
name = "miniirc"
version = "2.0.0a9"
description = "A lightweight IRC framework."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    {name = "luk3yx"},
    {name = "Ronald Jerez"}
]
dependencies = []

[tool.taskipy.tasks]
test = "pytest -v tests/"
cov = "coverage run -m pytest -q tests/ && coverage report"
cov-server = "coverage html && python -m http.server 7777 -d ./htmlcov"

[project.optional-dependencies]
ssl = [
    "certifi>=2025.10.5",
]

[dependency-groups]
dev = [
    "coverage>=7.11.0",
    "miniirc",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "taskipy>=1.14.1",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
miniirc = { workspace = true, editable = true }
